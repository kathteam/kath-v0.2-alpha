version: '3.8'

services:
  kath:
    image: cpu64/kath:latest
    container_name: kath
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "5173:5173"  # Frontend
      - "8080:8080"  # Backend API
    environment:
      - DOMAIN=localhost
      - PORT=5173
      - DATABASE_PATH=instance/kath.db
      - USE_DATABASE_BACKEND=true
    volumes:
      # Mount workspace directory
      - ./data:/kath/app/back_end/src/workspace/default
      # Mount database directory for persistence
      - ./database:/kath/app/back_end/instance
    stdin_open: true
    tty: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/monitoring/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - kath-network

networks:
  kath-network:
    driver: bridge
