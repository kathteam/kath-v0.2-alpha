[pytest]
# Pytest configuration for KATH backend

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directory to search for tests
testpaths = tests

# Asyncio configuration
asyncio_mode = auto

# Options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Coverage options
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-branch
    # Warnings
    -W ignore::DeprecationWarning
    # Parallel execution (install pytest-xdist)
    # -n auto

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, require dependencies)
    slow: Slow-running tests
    tools: Tests for DNA analysis tools (SpliceAI, CADD, REVEL)
    data: Tests for data processing functions
    routes: Tests for API routes
    utils: Tests for utility functions
    smoke: Smoke tests for critical paths
    sanity: Sanity tests for basic functionality
    system: System integration tests

# Coverage settings
[coverage:run]
source = src
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*

[coverage:report]
exclude_lines =
    # Standard pragma
    pragma: no cover
    # Don't complain about missing debug code
    def __repr__
    # Don't complain if tests don't hit defensive assertion code
    raise AssertionError
    raise NotImplementedError
    # Don't complain if non-runnable code isn't run
    if __name__ == .__main__.:
    # Type checking
    if TYPE_CHECKING:
    # Abstract methods
    @abstractmethod
